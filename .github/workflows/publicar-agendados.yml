# Publica os artigos agendados: todo dia de manhã verifica se há artigo com a data de hoje
# e, se houver, dispara um novo build na Cloudflare Pages pelo deploy hook.
name: Publicar artigos agendados

on:
  schedule:
    - cron: '7 9 * * *' # 06:07 em Uberaba (UTC-3)
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica artigos com a data de hoje
        id: hoje
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          if grep -l "^data: \"$HOJE\"" src/content/blog/*.md; then
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum artigo agendado para $HOJE"
          fi
      - name: Dispara build na Cloudflare Pages
        if: steps.hoje.outputs.publicar == 'sim' || github.event_name == 'workflow_dispatch'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret CLOUDFLARE_DEPLOY_HOOK não configurado"; exit 1; fi
          curl -fsS -X POST "$HOOK"
